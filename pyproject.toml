[project]
name = "informatica-to-pyspark"
version = "1.0.0"
description = "Convert Informatica PowerCenter XML to PySpark ETL code with sample data generation"
authors = [
    {name = "Windsurf", email = "info@codeium.com"}
]
readme = "README_CONVERSION.md"
requires-python = ">=3.9"
dependencies = [
    "pyspark>=3.5.0",
]

[project.scripts]
infa-parse = "infa_to_pyspark_parser:main"
infa-generate = "generate_pyspark_code:main"
infa-sample-data = "generate_sample_data:main"
infa-run-etl = "run_etl:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
